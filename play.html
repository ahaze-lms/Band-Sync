<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BandSync — Play</title>
  <style>
    /* ── VARIABLES ─────────────────────────────────────────────── */
    :root {
      --bg:       #07070f;
      --bg2:      #0d0d1a;
      --bg3:      #111120;
      --border:   #1e1e30;
      --border2:  #2a2a40;
      --purple:   #7F77DD;
      --purple2:  #AFA9EC;
      --teal:     #1D9E75;
      --teal2:    #5DCAA5;
      --amber:    #BA7517;
      --amber2:   #EF9F27;
      --red:      #E24B4A;
      --red2:     #F09595;
      --text:     #d4d4e2;     /* keep in sync with index.html */
      --dim:      #8585a0;     /* lifted from #55556a for mobile legibility */
      --radius:   10px;
    }

    /* ── RESET ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;       /* bumped from 14 for legibility */
      line-height: 1.5;
      overflow-x: hidden;
    }
    button { cursor: pointer; font-family: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ── PAGE LAYOUT ───────────────────────────────────────────── */
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex; align-items: center;
      padding: 14px 24px;
      gap: 24px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }
    .back-link {
      font-size: 10px; letter-spacing: 2px; color: var(--dim);
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--purple); }

    .logo {
      font-size: 16px; font-weight: 600; letter-spacing: 4px; color: #fff;
    }
    .logo span { color: var(--purple); }

    .top-bar .state-label {
      font-size: 9px; letter-spacing: 3px; color: var(--dim);
      margin-left: auto;
    }

    /* ── STATE CONTAINER ───────────────────────────────────────── */
    #state {
      flex: 1;
      padding: 40px 24px;
      display: flex;
      justify-content: center;
    }
    .state-inner {
      width: 100%;
      max-width: 980px;
    }

    /* ── LOADING / ERROR ───────────────────────────────────────── */
    .center-msg {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 80px 24px; text-align: center;
    }
    .center-msg .title {
      font-size: 12px; letter-spacing: 3px; color: var(--dim);
    }
    .center-msg.error .title { color: var(--red); }
    .center-msg pre {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: 11px; color: var(--text);
      max-width: 560px; white-space: pre-wrap; text-align: left;
    }

    /* ── SONG SELECT ───────────────────────────────────────────── */
    .section-label {
      font-size: 10px; letter-spacing: 3px; color: var(--dim);
      margin-bottom: 14px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .song-card {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex; flex-direction: column; gap: 10px;
      text-align: left;
      color: inherit;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .song-card:hover {
      border-color: var(--purple);
      background: var(--bg3);
      transform: translateY(-1px);
    }
    .song-title {
      font-size: 15px; font-weight: 600; color: #fff; line-height: 1.3;
    }
    .song-meta {
      display: flex; gap: 14px; flex-wrap: wrap;
      font-size: 10px; letter-spacing: 1.5px; color: var(--dim);
    }
    .song-meta .pill { display: inline-flex; align-items: center; gap: 5px; }
    .song-tracks {
      font-size: 11px; color: var(--purple2);
      letter-spacing: 1px;
    }
    .badge-duet {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(127,119,221,0.12);
      border: 0.5px solid var(--purple);
      border-radius: 4px;
      font-size: 8px; letter-spacing: 2px; color: var(--purple2);
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ── SETUP ─────────────────────────────────────────────────── */
    .setup-song {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .setup-song-title {
      font-size: 16px; font-weight: 600; color: #fff;
    }
    .setup-song-meta {
      font-size: 10px; letter-spacing: 2px; color: var(--dim);
      margin-top: 4px;
    }
    .setup-song-pb {
      margin-top: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 11px; letter-spacing: 1.5px;
      color: var(--teal2);
    }
    .setup-song-pb.empty {
      color: var(--dim); font-style: italic;
    }
    .pb-new-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 8px;
      background: rgba(29,158,117,0.2);
      border: 0.5px solid var(--teal);
      color: var(--teal2);
      font-family: 'Space Mono', monospace;
      font-size: 9px; letter-spacing: 2px; font-weight: 700;
      border-radius: 4px;
      vertical-align: middle;
    }

    .setup-section {
      margin-bottom: 28px;
    }
    .setup-section-label {
      font-size: 10px; letter-spacing: 3px; color: var(--dim);
      margin-bottom: 10px;
    }

    /* Difficulty + speed selectors — two side-by-side dropdowns */
    .setup-difficulty {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 768px) {
      .setup-difficulty { grid-template-columns: 1fr; }
    }

    /* Player count buttons */
    .player-count {
      display: flex; gap: 8px;
    }
    .count-btn {
      width: 48px; height: 48px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--dim);
      font-size: 18px; font-weight: 600; font-family: inherit;
      transition: all 0.15s;
    }
    .count-btn:hover:not(:disabled) {
      border-color: var(--purple); color: var(--purple2);
    }
    .count-btn.active {
      background: rgba(127,119,221,0.15);
      border-color: var(--purple);
      color: var(--purple2);
    }
    .count-btn:disabled {
      opacity: 0.35; cursor: not-allowed;
    }
    .count-btn-note {
      font-size: 9px; letter-spacing: 2px; color: var(--dim);
      margin-left: 12px; align-self: center;
    }

    /* Per-player rows */
    .player-rows { display: flex; flex-direction: column; gap: 10px; }
    .player-row {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-left-width: 3px;
      border-radius: var(--radius);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 56px 1.1fr 1fr 1fr 1fr;
      gap: 14px;
      align-items: center;
    }

    /* Editable guest cell — name input + compact kind-switcher */
    .identity-guest-cell {
      display: grid;
      grid-template-columns: 1fr 88px;
      gap: 4px;
      align-items: stretch;
    }
    .identity-name-input {
      background: var(--bg3);
      color: var(--text);
      border: 0.5px solid var(--border2);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-family: inherit;
      width: 100%;
      min-width: 0;
    }
    .identity-name-input:focus {
      outline: none;
      border-color: var(--purple);
      background: var(--bg);
    }
    .identity-name-input::placeholder { color: var(--dim); font-style: italic; }
    .identity-kind-mini {
      width: 100%;
      font-size: 10px;
      padding: 7px 4px;
    }

    /* Identity display when a friend is attached — name + small avatar */
    .identity-attached {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg3);
      border: 0.5px solid var(--purple);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .identity-attached .ia-avatar {
      font-size: 16px;
    }
    .identity-attached .ia-name {
      color: #fff;
      font-weight: 500;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .identity-attached .ia-detach {
      background: transparent;
      border: none;
      color: var(--dim);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 4px;
    }
    .identity-attached .ia-detach:hover { color: var(--red); }

    /* Identity hint badge under the row */
    .identity-host  { color: var(--purple2); }
    .identity-guest { color: var(--dim); font-style: italic; }
    .identity-friend { color: var(--teal2); }

    /* ── CLAIM-CODE MODAL ──────────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(7, 7, 15, 0.78);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      padding: 24px;
    }
    .modal-card {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      max-width: 460px;
      width: 100%;
      display: flex; flex-direction: column; gap: 14px;
    }
    .modal-title {
      font-family: 'Space Mono', monospace;
      font-size: 13px; letter-spacing: 3px; color: #fff;
      text-align: center;
    }
    .modal-desc {
      font-size: 12px; color: var(--dim); line-height: 1.55;
      text-align: center;
    }
    .code-input-row {
      display: flex; gap: 8px; justify-content: center;
      margin: 8px 0;
    }
    .code-input {
      width: 48px; height: 56px;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 24px; font-weight: 700;
      background: var(--bg);
      color: #fff;
      border: 0.5px solid var(--border2);
      border-radius: 8px;
      caret-color: var(--purple);
    }
    .code-input:focus {
      outline: none;
      border-color: var(--purple);
      background: var(--bg3);
    }
    .modal-error {
      color: var(--red2);
      font-size: 11px;
      text-align: center;
      min-height: 14px;
    }
    .modal-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      margin-top: 4px;
    }
    .player-row.p1 { border-left-color: var(--purple); }
    .player-row.p2 { border-left-color: var(--teal); }
    .player-row.p3 { border-left-color: var(--amber); }
    .player-row.p4 { border-left-color: var(--red); }

    .player-tag {
      font-family: 'Space Mono', monospace;
      font-size: 14px; font-weight: 700; letter-spacing: 2px;
    }
    .player-row.p1 .player-tag { color: var(--purple2); }
    .player-row.p2 .player-tag { color: var(--teal2); }
    .player-row.p3 .player-tag { color: var(--amber2); }
    .player-row.p4 .player-tag { color: var(--red2); }

    .field {
      display: flex; flex-direction: column; gap: 4px;
    }
    .field-label {
      font-size: 9px; letter-spacing: 2px; color: var(--dim);
    }
    select {
      background: var(--bg3);
      color: var(--text);
      border: 0.5px solid var(--border2);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
    }
    select:hover { border-color: var(--purple); }
    select:focus { outline: none; border-color: var(--purple); }
    select:disabled { opacity: 0.4; cursor: not-allowed; }

    /* MIDI status line */
    .midi-status {
      font-size: 10px; letter-spacing: 2px; color: var(--dim);
      padding: 8px 0;
    }
    .midi-status.ok      { color: var(--teal2); }
    .midi-status.warn    { color: var(--amber2); }
    .midi-status.error   { color: var(--red2); }

    /* Action row */
    .actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 24px;
    }
    .btn-ghost {
      background: transparent;
      border: 0.5px solid var(--border2);
      color: var(--dim);
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 10px; letter-spacing: 2px;
      transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--purple); color: var(--purple2); }

    .btn-primary {
      background: var(--purple);
      border: none;
      color: #fff;
      padding: 12px 32px;
      border-radius: 6px;
      font-size: 12px; letter-spacing: 3px; font-weight: 600;
      transition: all 0.15s;
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 0 24px rgba(127,119,221,0.4);
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.35; cursor: not-allowed;
    }

    /* ── GAMEPLAY ──────────────────────────────────────────────── */
    /* Game state takes the full state container; song header sits up
       top, panels stack vertically. */
    .game-shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      height: calc(100vh - 80px);
    }
    .game-header {
      display: flex; align-items: center; gap: 18px;
      padding: 10px 14px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
    }
    .game-song {
      font-size: 13px; font-weight: 600; color: #fff;
    }
    .game-meta {
      font-size: 10px; letter-spacing: 2px; color: var(--dim);
    }
    .game-time {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      font-size: 12px; color: var(--text);
    }

    /* Grid layouts for 1-4 players. Each panel is a column-flex
       container: score strip on top, canvas filling below. */
    .game-panels {
      display: grid;
      gap: 8px;
      min-height: 0;
    }
    .game-panels.players-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .game-panels.players-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .game-panels.players-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
    .game-panels.players-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .game-panel {
      display: grid;
      grid-template-rows: auto 1fr;          /* score on top, canvas fills below */
      gap: 6px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-top-width: 3px;
      border-radius: var(--radius);
      padding: 6px 10px 8px;
      min-width: 0; min-height: 0;
      overflow: hidden;
    }
    .game-panel.p1 { border-top-color: var(--purple); }
    .game-panel.p2 { border-top-color: var(--teal); }
    .game-panel.p3 { border-top-color: var(--amber); }
    .game-panel.p4 { border-top-color: var(--red); }

    /* Compact horizontal score strip — flexes to fit any panel width.
       At small panel widths some items wrap or hide; SCORE always shown. */
    .score-card {
      display: flex; align-items: center;
      gap: 14px;
      padding: 4px 6px;
      flex-wrap: wrap;
    }
    .score-tag {
      font-family: 'Space Mono', monospace;
      font-size: 12px; font-weight: 700; letter-spacing: 3px;
    }
    .p1 .score-tag { color: var(--purple2); }
    .p2 .score-tag { color: var(--teal2); }
    .p3 .score-tag { color: var(--amber2); }
    .p4 .score-tag { color: var(--red2); }

    .score-stat {
      display: flex; align-items: baseline; gap: 5px;
    }
    .score-stat .lab {
      font-size: 9px; letter-spacing: 2px; color: var(--dim);
    }
    .score-stat .val {
      font-family: 'Space Mono', monospace;
      font-size: 13px; color: #fff;
    }
    .score-stat .val.big {
      font-size: 18px; font-weight: 700;
    }
    .score-stat .val.dim { color: var(--dim); }
    .score-pgmw {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      font-size: 10px; color: var(--dim);
      letter-spacing: 1px;
    }

    /* Canvas fills the rest of the panel and scales via object-fit:contain,
       so the keyboard upsizes at 1-player full screen and downsizes at
       4-player quad without ever distorting the aspect ratio. */
    .canvas-stage {
      position: relative;
      min-width: 0; min-height: 0;
      overflow: hidden;
    }
    .canvas-stage canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .feedback-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-family: 'Space Mono', monospace;
      font-size: 56px; font-weight: 700; letter-spacing: 6px;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s, transform 0.12s;
      text-shadow: 0 0 18px currentColor;
    }
    .feedback-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .feedback-overlay.perfect { color: var(--teal2); }
    .feedback-overlay.good    { color: var(--purple2); }
    .feedback-overlay.miss    { color: var(--amber2); }
    .feedback-overlay.wrong   { color: var(--red2); }

    /* Game control bar */
    .game-controls {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
    }
    .game-controls .spacer { flex: 1; }
    .game-controls .btn-ghost { padding: 8px 14px; }
    .warmup-hint {
      font-size: 11px; letter-spacing: 1.5px;
      color: var(--dim);
      font-style: italic;
      margin-right: 8px;
    }

    /* ── RESULTS ───────────────────────────────────────────────── */
    .results-card {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 16px;
    }
    .results-song {
      font-size: 18px; font-weight: 600; color: #fff;
      text-align: center;
    }
    .results-subtitle {
      font-size: 11px; letter-spacing: 3px; color: var(--dim);
      text-align: center;
      margin-bottom: 24px;
    }
    .results-players {
      display: grid;
      gap: 14px;
    }
    .results-row {
      display: grid;
      grid-template-columns: 60px 1fr 80px 100px 80px;
      gap: 16px;
      align-items: center;
      padding: 14px 18px;
      background: var(--bg3);
      border: 0.5px solid var(--border);
      border-left-width: 3px;
      border-radius: 8px;
    }
    .results-row.p1 { border-left-color: var(--purple); }
    .results-row.p2 { border-left-color: var(--teal); }
    .results-row.p3 { border-left-color: var(--amber); }
    .results-row.p4 { border-left-color: var(--red); }
    .results-tag {
      font-family: 'Space Mono', monospace;
      font-size: 14px; font-weight: 700; letter-spacing: 3px;
    }
    .results-row.p1 .results-tag { color: var(--purple2); }
    .results-row.p2 .results-tag { color: var(--teal2); }
    .results-row.p3 .results-tag { color: var(--amber2); }
    .results-row.p4 .results-tag { color: var(--red2); }
    .results-pgmw {
      font-family: 'Space Mono', monospace;
      font-size: 11px; color: var(--dim); letter-spacing: 1px;
    }
    .results-score {
      font-family: 'Space Mono', monospace;
      font-size: 18px; font-weight: 700; color: #fff;
      text-align: right;
    }
    .results-acc {
      font-family: 'Space Mono', monospace;
      font-size: 15px; color: var(--text);
      text-align: right;
    }
    .results-grade {
      font-family: 'Space Mono', monospace;
      font-size: 28px; font-weight: 700; color: #fff;
      text-align: center;
    }
    .save-status {
      margin-top: 18px;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 2px;
      text-align: center;
      transition: all 0.2s;
    }
    .save-status.saving { color: var(--dim);  background: var(--bg3);  }
    .save-status.saved  { color: var(--teal2); background: rgba(29,158,117,0.12); }
    .save-status.failed { color: var(--red2);  background: rgba(226,75,74,0.12);  }

    /* ── MOBILE TWEAKS (≤ 768px) ────────────────────────────────
       Quick-pass mobile friendliness — not a full responsive redesign.
       Goals:
        - Player panels stack vertically regardless of count (side-by-side
          is unreadable at phone widths)
        - Piano canvas keeps its natural pixel size and scrolls
          horizontally so keys stay touch-sized (~36px wide) instead of
          getting squished to ~16px under object-fit:contain
        - Slightly tighter chrome (the surrounding header/song info
          eats vertical space that mobile players want for the canvas)
    */
    @media (max-width: 768px) {
      .top-bar { padding: 10px 14px; gap: 14px; }
      .game-shell { gap: 6px; height: calc(100vh - 60px); }
      .game-header { padding: 8px 12px; gap: 10px; flex-wrap: wrap; }
      .game-header .game-time { margin-left: auto; }

      /* Always stack: every game-panels grid becomes a vertical column */
      .game-panels.players-1,
      .game-panels.players-2,
      .game-panels.players-3,
      .game-panels.players-4 {
        grid-template-columns: 1fr;
        grid-auto-rows: 1fr;
        grid-template-rows: none;
      }

      .game-panel { padding: 4px 6px 6px; min-height: 220px; }
      .score-card { gap: 10px; font-size: 11px; }
      .score-stat .val.big { font-size: 16px; }

      /* Canvas: keep natural size, scroll horizontally if it overflows.
         Each white key stays ~36px wide instead of being scaled to <20px. */
      .canvas-stage {
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
      }
      .canvas-stage canvas {
        width: auto;
        height: 100%;
        max-width: none;
        object-fit: none;
      }

      /* Setup screen — give the player rows room to breathe */
      .player-row {
        grid-template-columns: 56px 1fr;
        grid-auto-rows: auto;
        row-gap: 8px;
      }
      .player-row .field { grid-column: 2; }
      .player-tag { grid-row: span 4; align-self: start; padding-top: 10px; }

      .song-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
