<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BandSync — Play</title>
  <style>
    /* ── VARIABLES ─────────────────────────────────────────────── */
    :root {
      --bg:       #07070f;
      --bg2:      #0d0d1a;
      --bg3:      #111120;
      --border:   #1e1e30;
      --border2:  #2a2a40;
      --purple:   #7F77DD;
      --purple2:  #AFA9EC;
      --teal:     #1D9E75;
      --teal2:    #5DCAA5;
      --amber:    #BA7517;
      --amber2:   #EF9F27;
      --red:      #E24B4A;
      --red2:     #F09595;
      --text:     #c8c8d8;
      --dim:      #55556a;
      --radius:   10px;
    }

    /* ── RESET ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      overflow-x: hidden;
    }
    button { cursor: pointer; font-family: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ── PAGE LAYOUT ───────────────────────────────────────────── */
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex; align-items: center;
      padding: 14px 24px;
      gap: 24px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }
    .back-link {
      font-size: 10px; letter-spacing: 2px; color: var(--dim);
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--purple); }

    .logo {
      font-size: 16px; font-weight: 600; letter-spacing: 4px; color: #fff;
    }
    .logo span { color: var(--purple); }

    .top-bar .state-label {
      font-size: 9px; letter-spacing: 3px; color: var(--dim);
      margin-left: auto;
    }

    /* ── STATE CONTAINER ───────────────────────────────────────── */
    #state {
      flex: 1;
      padding: 40px 24px;
      display: flex;
      justify-content: center;
    }
    .state-inner {
      width: 100%;
      max-width: 980px;
    }

    /* ── LOADING / ERROR ───────────────────────────────────────── */
    .center-msg {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 80px 24px; text-align: center;
    }
    .center-msg .title {
      font-size: 12px; letter-spacing: 3px; color: var(--dim);
    }
    .center-msg.error .title { color: var(--red); }
    .center-msg pre {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: 11px; color: var(--text);
      max-width: 560px; white-space: pre-wrap; text-align: left;
    }

    /* ── SONG SELECT ───────────────────────────────────────────── */
    .section-label {
      font-size: 10px; letter-spacing: 3px; color: var(--dim);
      margin-bottom: 14px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .song-card {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex; flex-direction: column; gap: 10px;
      text-align: left;
      color: inherit;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .song-card:hover {
      border-color: var(--purple);
      background: var(--bg3);
      transform: translateY(-1px);
    }
    .song-title {
      font-size: 15px; font-weight: 600; color: #fff; line-height: 1.3;
    }
    .song-meta {
      display: flex; gap: 14px; flex-wrap: wrap;
      font-size: 10px; letter-spacing: 1.5px; color: var(--dim);
    }
    .song-meta .pill { display: inline-flex; align-items: center; gap: 5px; }
    .song-tracks {
      font-size: 11px; color: var(--purple2);
      letter-spacing: 1px;
    }
    .badge-duet {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(127,119,221,0.12);
      border: 0.5px solid var(--purple);
      border-radius: 4px;
      font-size: 8px; letter-spacing: 2px; color: var(--purple2);
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ── SETUP ─────────────────────────────────────────────────── */
    .setup-song {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .setup-song-title {
      font-size: 16px; font-weight: 600; color: #fff;
    }
    .setup-song-meta {
      font-size: 10px; letter-spacing: 2px; color: var(--dim);
      margin-top: 4px;
    }

    .setup-section {
      margin-bottom: 28px;
    }
    .setup-section-label {
      font-size: 10px; letter-spacing: 3px; color: var(--dim);
      margin-bottom: 10px;
    }

    /* Player count buttons */
    .player-count {
      display: flex; gap: 8px;
    }
    .count-btn {
      width: 48px; height: 48px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--dim);
      font-size: 18px; font-weight: 600; font-family: inherit;
      transition: all 0.15s;
    }
    .count-btn:hover:not(:disabled) {
      border-color: var(--purple); color: var(--purple2);
    }
    .count-btn.active {
      background: rgba(127,119,221,0.15);
      border-color: var(--purple);
      color: var(--purple2);
    }
    .count-btn:disabled {
      opacity: 0.35; cursor: not-allowed;
    }
    .count-btn-note {
      font-size: 9px; letter-spacing: 2px; color: var(--dim);
      margin-left: 12px; align-self: center;
    }

    /* Per-player rows */
    .player-rows { display: flex; flex-direction: column; gap: 10px; }
    .player-row {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-left-width: 3px;
      border-radius: var(--radius);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 56px 1fr 1fr 1fr;
      gap: 16px;
      align-items: center;
    }
    .player-row.p1 { border-left-color: var(--purple); }
    .player-row.p2 { border-left-color: var(--teal); }
    .player-row.p3 { border-left-color: var(--amber); }
    .player-row.p4 { border-left-color: var(--red); }

    .player-tag {
      font-family: 'Space Mono', monospace;
      font-size: 14px; font-weight: 700; letter-spacing: 2px;
    }
    .player-row.p1 .player-tag { color: var(--purple2); }
    .player-row.p2 .player-tag { color: var(--teal2); }
    .player-row.p3 .player-tag { color: var(--amber2); }
    .player-row.p4 .player-tag { color: var(--red2); }

    .field {
      display: flex; flex-direction: column; gap: 4px;
    }
    .field-label {
      font-size: 9px; letter-spacing: 2px; color: var(--dim);
    }
    select {
      background: var(--bg3);
      color: var(--text);
      border: 0.5px solid var(--border2);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
    }
    select:hover { border-color: var(--purple); }
    select:focus { outline: none; border-color: var(--purple); }
    select:disabled { opacity: 0.4; cursor: not-allowed; }

    /* MIDI status line */
    .midi-status {
      font-size: 10px; letter-spacing: 2px; color: var(--dim);
      padding: 8px 0;
    }
    .midi-status.ok      { color: var(--teal2); }
    .midi-status.warn    { color: var(--amber2); }
    .midi-status.error   { color: var(--red2); }

    /* Action row */
    .actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 24px;
    }
    .btn-ghost {
      background: transparent;
      border: 0.5px solid var(--border2);
      color: var(--dim);
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 10px; letter-spacing: 2px;
      transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--purple); color: var(--purple2); }

    .btn-primary {
      background: var(--purple);
      border: none;
      color: #fff;
      padding: 12px 32px;
      border-radius: 6px;
      font-size: 12px; letter-spacing: 3px; font-weight: 600;
      transition: all 0.15s;
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 0 24px rgba(127,119,221,0.4);
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.35; cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <a class="back-link" href="index.html">← BACK</a>
      <div class="logo">BAND<span>SYNC</span></div>
      <div class="state-label" id="state-label"></div>
    </header>
    <main id="state">
      <div class="center-msg"><div class="title">LOADING…</div></div>
    </main>
  </div>

  <!-- Supabase UMD bundle, served locally -->
  <script src="js/vendor/supabase.umd.js"></script>
  <script type="module" src="js/play.js?v=2"></script>
</body>
</html>
