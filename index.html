<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BandSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ── VARIABLES ──────────────────────────────────────────── */
    :root {
      --bg:       #07070f;
      --bg2:      #0d0d1a;
      --bg3:      #111120;
      --border:   #1e1e30;
      --border2:  #2a2a40;
      --purple:   #7F77DD;
      --purple2:  #AFA9EC;
      --purple-d: #534AB7;
      --teal:     #1D9E75;
      --teal2:    #5DCAA5;
      --amber:    #BA7517;
      --red:      #E24B4A;
      --text:     #d4d4e2;     /* slightly brighter body copy */
      --dim:      #8585a0;     /* lifted from #55556a — old value was borderline contrast on mobile */
      --radius:   10px;
    }

    /* ── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;       /* bumped from 14 for legibility, esp. on mobile */
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }

    /* ── APP SHELL ───────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── NAV ─────────────────────────────────────────────────── */
    #main-nav {
      display: none;
      align-items: center;
      gap: 24px;
      padding: 0 20px;
      height: 52px;
      background: var(--bg2);
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0;
    }
    .nav-logo {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      letter-spacing: 4px;
      color: #fff;
      font-weight: 700;
    }
    .nav-logo span { color: var(--purple); }
    .nav-links { display: flex; gap: 4px; }
    .nav-link {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--dim);
      display: flex; align-items: center; gap: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .nav-link:hover { color: var(--text); background: var(--bg3); }
    .nav-link.active { color: var(--purple2); background: rgba(127,119,221,0.12); }
    .nav-lab { opacity: 0.45; margin-left: 8px; border-left: 0.5px solid #1e1e2a; padding-left: 16px; }
    .nav-lab:hover { opacity: 1; }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .nav-avatar {
      font-size: 22px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--bg3);
      border: 1px solid var(--border2);
      transition: border-color 0.15s;
    }
    .nav-avatar:hover { border-color: var(--purple); }
    .btn-signout {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      padding: 5px 10px;
      background: transparent;
      border: 0.5px solid var(--border2);
      border-radius: 5px;
      color: var(--dim);
      transition: all 0.15s;
    }
    .btn-signout:hover { border-color: var(--red); color: var(--red); }

    /* ── MAIN CONTENT ────────────────────────────────────────── */
    #main-content {
      overflow-y: auto;
      min-height: 0;
    }
    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--dim);
    }

    /* ── SHARED BUTTONS ──────────────────────────────────────── */
    .btn {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--purple-d);
      border: 1px solid var(--purple);
      color: #fff;
    }
    .btn-primary:hover { background: var(--purple); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      border: 0.5px solid var(--border2);
      color: var(--dim);
    }
    .btn-ghost:hover { border-color: var(--purple); color: var(--purple2); }
    .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-sm { font-size: 9px; padding: 4px 10px; }
    .btn-full { width: 100%; justify-content: center; }
    .btn-play {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      letter-spacing: 4px;
      padding: 14px 36px;
      background: var(--purple-d);
      border: 1px solid var(--purple);
      color: #fff;
      border-radius: 8px;
      transition: all 0.2s;
      display: inline-block;
    }
    .btn-play:hover { background: var(--purple); box-shadow: 0 0 24px rgba(127,119,221,0.3); transform: translateY(-1px); }

    /* ── SHARED FORMS ────────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--dim);
    }
    .input {
      background: var(--bg);
      border: 0.5px solid var(--border2);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.15s;
      width: 100%;
    }
    .input:focus { outline: none; border-color: var(--purple); }
    .input::placeholder { color: var(--dim); }
    .field-hint { font-size: 11px; min-height: 16px; }
    .hint-ok    { color: var(--teal2); }
    .hint-error { color: var(--red); }
    .hint-dim   { color: var(--dim); }

    /* ── SHARED CARDS / PANELS ───────────────────────────────── */
    .panel {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .panel-title {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dim { color: var(--dim); }

    /* ── FRIEND ROW (shared) ─────────────────────────────────── */
    .friend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      border-bottom: 0.5px solid var(--border);
    }
    .friend-row:last-child { border-bottom: none; }
    .friend-avatar { font-size: 20px; flex-shrink: 0; }
    .friend-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .friend-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .status-dot.online  { background: var(--teal2); box-shadow: 0 0 6px var(--teal2); }
    .status-dot.offline { background: var(--border2); }

    /* ── BADGE ───────────────────────────────────────────────── */
    .badge {
      background: var(--red);
      color: #fff;
      font-size: 9px;
      font-family: 'Space Mono', monospace;
      padding: 1px 5px;
      border-radius: 10px;
      line-height: 1.4;
    }
    .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--purple); flex-shrink: 0; }

    /* ── AUTH SCREEN ─────────────────────────────────────────── */
    .auth-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      gap: 20px;
    }
    .auth-logo {
      font-family: 'Space Mono', monospace;
      font-size: 36px;
      letter-spacing: 8px;
      color: #fff;
      font-weight: 700;
    }
    .auth-logo span { color: var(--purple); }
    .auth-sub {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--dim);
      margin-top: -14px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 0.5px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--dim);
      transition: all 0.15s;
    }
    .auth-tab.active { color: var(--purple2); background: rgba(127,119,221,0.08); }
    .auth-tab:hover:not(.active) { color: var(--text); }
    .auth-form { display: flex; flex-direction: column; gap: 14px; padding: 24px; }
    .auth-error { color: var(--red); font-size: 12px; min-height: 16px; }
    .auth-note  { color: var(--teal2); font-size: 12px; min-height: 16px; }
    .auth-footer {
      font-size: 11px;
      color: var(--dim);
      text-align: center;
    }
    .auth-footer a { color: var(--purple2); }
    .auth-footer a:hover { text-decoration: underline; }

    /* ── HOME SCREEN ─────────────────────────────────────────── */
    .home-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .home-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
    }
    .home-greeting { display: flex; align-items: center; gap: 14px; }
    .home-avatar { font-size: 36px; }
    .home-name   { font-size: 20px; font-weight: 500; color: #fff; letter-spacing: 1px; }
    .home-tagline { font-size: 12px; color: var(--dim); }
    .home-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .home-panels { grid-template-columns: 1fr; } }

    /* ── PROFILE EDIT ────────────────────────────────────────── */
    .form-page {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 20px;
    }
    .form-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .form-card-title {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      color: #fff;
      text-align: center;
    }
    .avatar-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .avatar-opt {
      font-size: 24px;
      width: 44px; height: 44px;
      border-radius: 8px;
      background: var(--bg);
      border: 1.5px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .avatar-opt:hover  { border-color: var(--purple); }
    .avatar-opt.selected { border-color: var(--purple); background: rgba(127,119,221,0.15); }
    /* ── HISTORY ─────────────────────────────────────────────── */
    .history-page {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    .history-loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--dim);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
    }
    .history-empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--dim);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      line-height: 2;
    }
    .history-link { color: var(--purple2); text-decoration: underline; }
    .history-header {
      display: flex;
      align-items: baseline;
      gap: 18px;
      margin-bottom: 20px;
    }
    .history-title {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      letter-spacing: 4px;
      color: #fff;
    }
    .history-meta {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--dim);
    }
    .history-section-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--dim);
      margin: 22px 0 8px;
      padding-bottom: 6px;
      border-bottom: 0.5px solid var(--border);
    }
    .history-section-label:first-of-type { margin-top: 0; }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-card {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
    }
    .history-card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .history-song {
      font-size: 13px; font-weight: 600; color: #fff;
    }
    .history-time {
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 2px;
      color: var(--dim);
    }
    .history-card-foot {
      margin-top: 8px;
      font-size: 10px;
      letter-spacing: 1px;
      text-align: center;
    }
    .history-slots {
      display: flex; flex-direction: column;
      gap: 2px;
    }
    .history-slot {
      display: grid;
      grid-template-columns: 36px 1.4fr 1fr 80px 60px 40px;
      gap: 10px;
      align-items: center;
      padding: 6px 4px;
      font-size: 12px;
      border-radius: 6px;
    }
    .history-slot.me {
      background: rgba(127,119,221,0.06);
      padding: 6px 8px;
    }
    .hs-tag {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
    }
    .hs-tag.p1 { color: var(--purple2); }
    .hs-tag.p2 { color: var(--teal2); }
    .hs-tag.p3 { color: var(--amber); }
    .hs-tag.p4 { color: var(--red); }
    .hs-identity {
      display: flex; align-items: center; gap: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hs-avatar { font-size: 11px; color: var(--dim); }
    .hs-track {
      font-size: 11px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hs-score {
      font-family: 'Space Mono', monospace;
      font-size: 13px; font-weight: 700; color: #fff;
      text-align: right;
    }
    .hs-acc {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-align: right;
    }
    .hs-grade {
      font-family: 'Space Mono', monospace;
      font-size: 14px; font-weight: 700;
      text-align: center; color: #fff;
    }
    .pb-badge {
      display: inline-block;
      background: rgba(29,158,117,0.18);
      border: 0.5px solid var(--teal);
      color: var(--teal2);
      font-family: 'Space Mono', monospace;
      font-size: 8px; letter-spacing: 1.5px; font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .identity-host   { color: var(--purple2); }
    .identity-friend { color: var(--teal2); }
    .identity-guest  { color: var(--dim); font-style: italic; }

    /* ── PAIRING (device codes) ──────────────────────────────── */
    .pairing-explainer {
      font-size: 12px; color: var(--dim); line-height: 1.55;
    }
    .pairing-explainer code {
      color: var(--purple2);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
    }
    .pairing-list {
      display: flex; flex-direction: column; gap: 8px;
    }
    .pairing-empty {
      font-size: 11px; color: var(--dim);
      letter-spacing: 1px;
      padding: 12px 0;
      text-align: center;
    }
    .pairing-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 14px;
      align-items: center;
      background: var(--bg);
      border: 0.5px solid var(--border2);
      border-radius: 8px;
      padding: 12px 14px;
      transition: border-color 0.2s, background 0.4s;
    }
    .pairing-row.fresh {
      border-color: var(--purple);
      background: rgba(127,119,221,0.06);
    }
    .pairing-code {
      font-family: 'Space Mono', monospace;
      font-size: 22px; font-weight: 700; letter-spacing: 8px;
      color: #fff;
    }
    .pairing-meta {
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 1.5px;
      color: var(--dim);
    }
    .pairing-meta.warn { color: var(--amber); }
    .btn-revoke {
      background: transparent;
      border: 0.5px solid var(--border2);
      color: var(--dim);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 9px; letter-spacing: 2px;
      transition: all 0.15s;
    }
    .btn-revoke:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* ── ACTIVITY (audit log of code uses) ───────────────────── */
    .activity-list {
      display: flex; flex-direction: column;
      gap: 2px;
    }
    .activity-row {
      display: grid;
      grid-template-columns: 28px 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      border: 0.5px solid transparent;
      transition: background 0.15s;
    }
    .activity-row:hover { background: var(--bg3); }
    .activity-avatar {
      font-size: 16px; text-align: center;
    }
    .activity-name {
      color: #fff; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .activity-time {
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 1.5px;
      color: var(--dim);
    }
    .activity-code {
      font-family: 'Space Mono', monospace;
      font-size: 11px; letter-spacing: 3px;
      color: var(--purple2);
    }

    .color-grid { display: flex; gap: 10px; }
    .color-opt {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-opt:hover   { transform: scale(1.15); }
    .color-opt.selected { transform: scale(1.15); outline: 2px solid #fff; outline-offset: 2px; }

    /* ── FRIENDS SCREEN ──────────────────────────────────────── */
    .friends-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    .search-row { margin-bottom: 8px; }

    /* ── INBOX SCREEN ────────────────────────────────────────── */
    .inbox-wrap {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100%;
      overflow: hidden;
    }
    .inbox-sidebar {
      border-right: 0.5px solid var(--border);
      overflow-y: auto;
      background: var(--bg2);
    }
    .inbox-main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .inbox-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--dim);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .convo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 0.5px solid var(--border);
      transition: background 0.1s;
    }
    .convo-row:hover  { background: var(--bg3); }
    .convo-row.active { background: rgba(127,119,221,0.1); }
    .convo-row.unread .friend-name { color: #fff; }
    .convo-preview {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-msg { display: flex; flex-direction: column; max-width: 70%; }
    .chat-msg.mine  { align-self: flex-end; align-items: flex-end; }
    .chat-msg.theirs { align-self: flex-start; }
    .chat-bubble {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
    .chat-msg.mine  .chat-bubble { background: var(--purple-d); color: #fff; border-bottom-right-radius: 3px; }
    .chat-msg.theirs .chat-bubble { background: var(--bg3); border: 0.5px solid var(--border); border-bottom-left-radius: 3px; }
    .chat-time { font-size: 10px; color: var(--dim); margin-top: 2px; }
    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 0.5px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }
    .chat-input-row .input { flex: 1; }

    /* Inline "← BACK" button in the chat header. Visible only on mobile
       (the single-pane layout) — pops the user back to the conversation list. */
    .chat-back-btn {
      display: none;
      background: transparent;
      border: 0.5px solid var(--border2);
      color: var(--dim);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 2px;
      margin-right: 8px;
      cursor: pointer;
    }
    .chat-back-btn:hover { color: var(--purple2); border-color: var(--purple); }

    /* ── MOBILE TWEAKS (≤ 768px) ────────────────────────────────
       Quick-pass mobile friendliness — not a full responsive redesign.
       Inbox flips to a single-pane "list ↔ conversation" model so the
       chat is actually usable on a phone, and the viewport uses dvh so
       the on-screen keyboard doesn't cover the input. */
    @media (max-width: 768px) {
      /* Dynamic viewport height — accounts for the soft keyboard.
         Falls back to 100vh on browsers that don't support dvh. */
      #app { height: 100dvh; }

      /* Inbox single-pane */
      .inbox-wrap {
        grid-template-columns: 1fr;
      }
      .inbox-main {
        display: none;
      }
      .inbox-wrap.has-active .inbox-sidebar {
        display: none;
      }
      .inbox-wrap.has-active .inbox-main {
        display: flex;
      }
      .chat-back-btn { display: inline-flex; }

      /* iOS auto-zooms inputs whose font-size is < 16px. Stops the
         awkward "tap → page zooms in" jump when focusing the message
         input. */
      .chat-input-row .input { font-size: 16px; }
      .input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <nav id="main-nav" style="display:none"></nav>
    <div id="main-content"></div>
  </div>
  <!-- Supabase served locally — eliminates CDN round-trip on every load -->
  <script src="js/vendor/supabase.umd.js"></script>
  <script>
    function _esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function _errBox(title, body, hint) {
      document.getElementById('main-content').innerHTML =
        `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                     height:100%;gap:16px;font-family:'Space Mono',monospace;padding:24px;text-align:center">
          <div style="color:#E24B4A;font-size:13px;letter-spacing:3px">${_esc(title)}</div>
          <div style="background:#0d0d1a;border:1px solid #2a2a40;border-radius:8px;padding:16px 24px;
                      max-width:600px;width:100%">
            <pre style="color:#c8c8d8;font-size:11px;white-space:pre-wrap;text-align:left;margin:0">${_esc(body)}</pre>
          </div>
          <div style="color:#55556a;font-size:10px;letter-spacing:1px">${_esc(hint)}</div>
          <button onclick="location.reload()"
            style="padding:8px 20px;background:transparent;border:1px solid #2a2a40;color:#55556a;
                   border-radius:6px;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:2px">
            RETRY
          </button>
        </div>`;
    }
    window.addEventListener('unhandledrejection', e => {
      const msg = e.reason?.stack ?? e.reason?.message ?? String(e.reason);
      _errBox('UNHANDLED ERROR', msg, 'Open DevTools (F12) → Console for full details');
    });
    window.onerror = (msg, src, line) => {
      _errBox('JAVASCRIPT ERROR', `${msg}\n${src} : ${line}`, 'Open DevTools (F12) → Console for full details');
    };
  </script>
  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
