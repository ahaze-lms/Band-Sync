<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BandSync — Song Creator</title>
  <style>
    :root {
      --bg:     #101022;
      --bg2:    #18182e;
      --bg3:    #1e1e34;
      --text:   #d8d8e8;
      --dim:    #8585a0;
      --purple:  #7F77DD;
      --purple2: #AFA9EC;
      --teal:    #1D9E75;
      --red:     #E0533C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100dvh; background: var(--bg); }

    body {
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── HEADER ─────────────────────────────────────────────────── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .back-link {
      font-size: 11px; letter-spacing: 2px; color: var(--dim);
      text-decoration: none; transition: color 0.15s;
      padding: 8px; min-height: 44px;
      display: inline-flex; align-items: center;
    }
    .back-link:hover { color: var(--purple); }
    .logo {
      font-size: 18px; font-weight: 500; letter-spacing: 4px; color: #fff;
    }
    .logo span { color: var(--purple); }
    .page-title {
      font-size: 10px; letter-spacing: 3px; color: var(--dim);
    }

    /* ── TRANSPORT BAR ──────────────────────────────────────────── */
    .transport {
      background: var(--bg2);
      border: 0.5px solid var(--bg3);
      border-radius: 12px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .transport-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .transport-section {
      display: flex; align-items: center; gap: 8px;
    }
    .field-label {
      font-size: 10px; letter-spacing: 2px; color: var(--dim);
      text-transform: uppercase;
    }
    .bpm-input {
      width: 76px;
      min-height: 44px;
      background: var(--bg3); color: var(--text);
      border: 1px solid var(--bg3); border-radius: 8px;
      font-size: 18px; font-weight: 600; text-align: center;
      padding: 4px 8px;
    }
    .bpm-input:focus {
      outline: none; border-color: var(--purple);
    }
    .tap-btn {
      min-height: 44px; padding: 0 16px;
      background: var(--bg3); color: var(--text);
      border: 1px solid var(--bg3); border-radius: 8px;
      font-size: 13px; letter-spacing: 2px;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .tap-btn:hover { border-color: var(--purple); }
    .tap-btn:active { background: var(--purple); color: #fff; }
    .tap-btn.flash {
      background: var(--purple); color: #fff;
      transition: background 0.4s;
    }

    /* Transport action buttons — RECORD / STOP / PLAY */
    .transport-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
    }
    .t-btn {
      min-height: 52px;
      background: var(--bg3); color: var(--text);
      border: 1px solid var(--bg3); border-radius: 10px;
      font-size: 13px; font-weight: 600; letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .t-btn:hover:not(:disabled) { border-color: var(--purple); }
    .t-btn:active:not(:disabled) { transform: scale(0.97); }
    .t-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .t-btn .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: currentColor; opacity: 0.7;
    }
    .t-btn.record .dot { background: var(--red); opacity: 1; }
    .t-btn.record.active {
      background: rgba(224, 83, 60, 0.18);
      border-color: var(--red);
      color: var(--red);
      animation: pulse 1.1s ease-in-out infinite;
    }
    .t-btn.play.active {
      background: rgba(29, 158, 117, 0.15);
      border-color: var(--teal);
      color: var(--teal);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.6; }
    }

    .time-display {
      flex: 1;
      text-align: right;
      font-family: 'Consolas', monospace;
      font-size: 13px; color: var(--dim);
      min-height: 44px;
      display: flex; align-items: center; justify-content: flex-end;
    }

    /* ── QUANTIZE PANEL ─────────────────────────────────────────── */
    .quantize-panel {
      background: var(--bg2);
      border: 0.5px solid var(--bg3);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap;
    }
    .quantize-buttons {
      display: flex; gap: 6px; flex-wrap: wrap;
      flex: 1;
    }
    .q-btn {
      min-height: 40px;
      padding: 0 14px;
      background: var(--bg3); color: var(--dim);
      border: 1px solid var(--bg3); border-radius: 6px;
      font-size: 12px; letter-spacing: 1px; font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
    }
    .q-btn:hover:not(:disabled) {
      border-color: var(--purple); color: var(--text);
    }
    .q-btn:active:not(:disabled) { transform: scale(0.97); }
    .q-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .q-btn.active {
      background: rgba(127, 119, 221, 0.18);
      border-color: var(--purple);
      color: var(--purple2);
    }

    /* ── TRACK ROW ──────────────────────────────────────────────── */
    .track-row {
      background: var(--bg2);
      border: 0.5px solid var(--bg3);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
    }
    .track-tag {
      background: var(--bg3);
      border: 0.5px solid var(--bg3);
      border-left: 3px solid var(--purple);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11px; letter-spacing: 2px;
      color: var(--text);
    }
    .track-info {
      font-size: 12px; color: var(--dim);
      flex: 1; min-width: 0;
    }
    .track-info b { color: var(--text); font-weight: 500; }
    .midi-status {
      font-size: 11px; letter-spacing: 1px;
      padding: 4px 10px; border-radius: 12px;
      background: var(--bg3); color: var(--dim);
    }
    .midi-status.connected { color: var(--teal); }
    .midi-status.error     { color: var(--red); }

    /* ── PIANO ROLL ─────────────────────────────────────────────── */
    .roll-wrap {
      background: var(--bg2);
      border: 0.5px solid var(--bg3);
      border-radius: 12px;
      padding: 6px;
      flex: 1;
      min-height: 320px;
      display: flex; flex-direction: column;
    }
    canvas#roll-canvas {
      width: 100%;
      height: 100%;
      min-height: 300px;
      flex: 1;
      display: block;
      border-radius: 8px;
      touch-action: none;   /* don't fight page-scroll while tap/drag-editing notes */
      cursor: crosshair;
    }
    .empty-hint {
      text-align: center;
      font-size: 11px; letter-spacing: 1px; color: var(--dim);
      padding: 12px 6px 6px;
    }

    /* ── TOUCH KEYBOARD (phase 1.5) ─────────────────────────────── */
    .keyboard-wrap {
      background: var(--bg2);
      border: 0.5px solid var(--bg3);
      border-radius: 12px;
      padding: 8px 6px 6px;
    }
    .keyboard-hint {
      text-align: center;
      font-size: 9px; letter-spacing: 3px; color: var(--dim);
      padding-bottom: 6px;
    }
    canvas#touch-keyboard {
      display: block;
      width: 100%;
      border-radius: 6px;
      touch-action: none;   /* lets us slide across keys without page-scrolling */
    }

    /* ── DESKTOP TWEAKS ─────────────────────────────────────────── */
    @media (min-width: 768px) {
      body {
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
        gap: 18px;
      }
      .transport {
        grid-template-columns: auto auto 1fr auto;
        padding: 16px 18px;
      }
      .transport-actions {
        grid-template-columns: auto auto auto;
        width: auto;
      }
      .t-btn { padding: 0 28px; }
      .roll-wrap { min-height: 480px; }
      canvas#roll-canvas { min-height: 460px; }
    }

    @media (min-width: 1200px) {
      body { padding: 28px 32px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <a class="back-link" href="index.html">← BACK</a>
    <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
      <div class="logo">BAND<span>SYNC</span></div>
      <div class="page-title">SONG CREATOR</div>
    </div>
    <div style="width:80px"></div>
  </div>

  <div class="transport">
    <div class="transport-section">
      <span class="field-label">BPM</span>
      <input id="bpm-input" class="bpm-input" type="number" min="40" max="240" step="1" value="120" inputmode="numeric">
      <button id="tap-btn" class="tap-btn" type="button">TAP</button>
    </div>

    <div class="transport-actions">
      <button id="record-btn" class="t-btn record" type="button">
        <span class="dot"></span>REC
      </button>
      <button id="stop-btn" class="t-btn stop" type="button" disabled>
        STOP
      </button>
      <button id="play-btn" class="t-btn play" type="button" disabled>
        ▶ PLAY
      </button>
    </div>

    <div id="time-display" class="time-display">Ready</div>
  </div>

  <div class="quantize-panel">
    <span class="field-label">QUANTIZE</span>
    <div class="quantize-buttons">
      <button class="q-btn active" data-grid="raw"  type="button">RAW</button>
      <button class="q-btn"        data-grid="1/4"  type="button">1/4</button>
      <button class="q-btn"        data-grid="1/8"  type="button">1/8</button>
      <button class="q-btn"        data-grid="1/16" type="button">1/16</button>
      <button class="q-btn"        data-grid="1/32" type="button">1/32</button>
    </div>
  </div>

  <div class="track-row">
    <div class="track-tag">TRACK 1 · PIANO</div>
    <div class="track-info"><b id="device-name">Initializing MIDI…</b></div>
    <div id="midi-status" class="midi-status">…</div>
  </div>

  <div class="roll-wrap">
    <canvas id="roll-canvas"></canvas>
    <div class="empty-hint" id="empty-hint">
      Connect a MIDI piano or use the on-screen keyboard below. Set BPM, hit REC — a 4-beat count-in plays before recording starts.
    </div>
  </div>

  <div class="keyboard-wrap">
    <div class="keyboard-hint">TOUCH OR CLICK TO PLAY</div>
    <canvas id="touch-keyboard"></canvas>
  </div>

  <script type="module">
    import { initMIDI, getInputs, attachListener, detachAll, onStateChange } from './js/core/midi.js?v=1';
    import { playPianoNote, playClick, resumeIfSuspended } from './js/core/audio.js?v=1';
    import { createSong, durationMs, addNote, removeNote } from './js/core/song.js?v=2';
    import { createRecorder } from './js/core/recorder.js?v=2';
    import { quantize } from './js/core/quantizer.js?v=1';
    import { createPianoRollRenderer } from './js/render/piano-roll.js?v=2';
    import { createPianoRenderer } from './js/render/piano.js?v=1';
    import { PIANO_NOTE_MIN, PIANO_NOTE_MAX, PLAYER_COLORS } from './js/config.js?v=1';

    // ── State ─────────────────────────────────────────────────────
    const song      = createSong(120);
    const recorder  = createRecorder(song);
    const canvas    = document.getElementById('roll-canvas');
    const renderer  = createPianoRollRenderer(canvas, song, {
      // Tap empty grid → add a new note. Duration is one beat at the
      // current tempo (visible on the roll, easy to drag/quantize
      // afterward). Audible preview plays the pitch you just placed.
      onAdd: (pitch, startMs) => {
        resumeIfSuspended();
        const beatMs = 60_000 / song.bpm;
        addNote(song, {
          pitch,
          startMs,
          startMsRaw: startMs,
          durationMs: beatMs,
          velocity:   80,
        });
        playPianoNote(pitch, 80);
      },
      // Selection is owned by the renderer; we still preview the
      // selected note's pitch so you can hear what you grabbed.
      onSelect: (note) => {
        if (note) {
          resumeIfSuspended();
          playPianoNote(note.pitch, note.velocity);
        }
      },
      // Drag finishes — node data was already updated in place by the
      // renderer. Nothing extra to do for now beyond a no-op hook.
      onMove: () => {},
      // Right-click / long-press a note → delete it from the song.
      onDelete: (note) => {
        removeNote(song, note);
      },
    });
    // Shared between MIDI and on-screen keyboard — lights up the
    // touch keyboard whenever any source is holding a note.
    const heldNotes = new Set();

    // ── Touch / click keyboard (phase 1.5) ────────────────────────
    // Reuses js/render/piano.js in keyboardOnly mode — same code path
    // the lobby warmup uses. Touch slide across keys works for free.
    const kbCanvas   = document.getElementById('touch-keyboard');
    const kbRenderer = createPianoRenderer(kbCanvas, {
      color:        PLAYER_COLORS[0],
      noteMin:      PIANO_NOTE_MIN,
      noteMax:      PIANO_NOTE_MAX,
      keyboardOnly: true,
      onKeyDown: note => {
        resumeIfSuspended();
        heldNotes.add(note);
        playPianoNote(note, 80);
        recorder.noteOn(note, 80);
      },
      onKeyUp: note => {
        heldNotes.delete(note);
        recorder.noteOff(note);
      },
    });

    let activeInputId = null;
    let countingIn    = false;
    let countInBeat   = 0;
    let countInTimer  = null;
    let playing       = false;
    let playStartedAt = 0;
    let playRafId     = null;
    let playTimeouts  = [];
    let activeGrid    = 'raw';   // active quantize grid; resets to 'raw' on each new take

    // ── DOM refs ──────────────────────────────────────────────────
    const bpmInput    = document.getElementById('bpm-input');
    const tapBtn      = document.getElementById('tap-btn');
    const recordBtn   = document.getElementById('record-btn');
    const stopBtn     = document.getElementById('stop-btn');
    const playBtn     = document.getElementById('play-btn');
    const timeDisplay = document.getElementById('time-display');
    const deviceName  = document.getElementById('device-name');
    const midiStatus  = document.getElementById('midi-status');
    const emptyHint   = document.getElementById('empty-hint');

    // ── Continuous draw loop ──────────────────────────────────────
    function tick() {
      if (recorder.isRecording()) renderer.setPlayhead(recorder.elapsedMs());
      renderer.draw();
      kbRenderer.draw({ fallingBlocks: [], heldNotes, countoff: null });
      requestAnimationFrame(tick);
    }
    tick();

    // ── MIDI init + device auto-pick ──────────────────────────────
    async function bootMidi() {
      const result = await initMIDI();
      if (!result.ok) {
        if (result.reason === 'unsupported') {
          deviceName.textContent = 'Web MIDI not supported — use the keyboard below';
          midiStatus.textContent = 'TOUCH ONLY';
        } else {
          deviceName.textContent = 'MIDI access denied — use the keyboard below';
          midiStatus.textContent = 'TOUCH ONLY';
        }
        // Don't disable record — the on-screen keyboard is a valid input.
        return;
      }
      pickFirstDevice();
      onStateChange(pickFirstDevice);
    }

    function pickFirstDevice() {
      const inputs = getInputs();
      detachAll();
      if (inputs.length === 0) {
        activeInputId = null;
        deviceName.textContent = 'No MIDI device connected';
        midiStatus.textContent = 'WAITING';
        midiStatus.classList.remove('connected', 'error');
        return;
      }
      activeInputId = inputs[0].id;
      deviceName.textContent = inputs[0].name;
      midiStatus.textContent = 'CONNECTED';
      midiStatus.classList.add('connected');
      midiStatus.classList.remove('error');

      attachListener(activeInputId, (evt) => {
        if (evt.type === 'noteOn') {
          playPianoNote(evt.note, evt.velocity);
          heldNotes.add(evt.note);
          recorder.noteOn(evt.note, evt.velocity);
        } else if (evt.type === 'noteOff') {
          heldNotes.delete(evt.note);
          recorder.noteOff(evt.note);
        }
      });
    }

    bootMidi();

    // ── BPM number input ──────────────────────────────────────────
    bpmInput.addEventListener('input', () => {
      const v = parseInt(bpmInput.value, 10);
      if (Number.isFinite(v) && v >= 40 && v <= 240) {
        song.bpm = v;
      }
    });

    // ── Tap tempo (average last 4 intervals) ──────────────────────
    let tapTimes = [];
    tapBtn.addEventListener('click', () => {
      const now = performance.now();
      // Reset chain if last tap was >2s ago — user is starting fresh.
      if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > 2000) {
        tapTimes = [];
      }
      tapTimes.push(now);
      if (tapTimes.length > 5) tapTimes.shift();   // keep last 4 intervals

      // Visual flash for tactile feedback.
      tapBtn.classList.add('flash');
      setTimeout(() => tapBtn.classList.remove('flash'), 120);

      if (tapTimes.length >= 2) {
        let sum = 0;
        for (let i = 1; i < tapTimes.length; i++) {
          sum += tapTimes[i] - tapTimes[i - 1];
        }
        const avgMs = sum / (tapTimes.length - 1);
        const bpm = Math.round(60_000 / avgMs);
        if (bpm >= 40 && bpm <= 240) {
          song.bpm = bpm;
          bpmInput.value = bpm;
        }
      }
    });

    // ── Transport: RECORD ─────────────────────────────────────────
    recordBtn.addEventListener('click', async () => {
      if (countingIn || recorder.isRecording() || playing) return;

      await resumeIfSuspended();
      countingIn = true;
      countInBeat = 0;
      updateButtons();
      emptyHint.style.display = 'none';

      const beatMs = 60_000 / song.bpm;
      // Fire first click immediately, then schedule the next three.
      const fireBeat = () => {
        if (!countingIn) return;
        playClick();
        countInBeat++;
        timeDisplay.textContent = `Count-in ${countInBeat}/4`;
        if (countInBeat >= 4) {
          countingIn = false;
          recorder.start();
          activeGrid = 'raw';        // fresh take is unquantized by default
          renderer.setSelected(null); // any prior selection no longer exists
          updateButtons();
          timeDisplay.textContent = 'Rec 0.0s';
          return;
        }
        countInTimer = setTimeout(fireBeat, beatMs);
      };
      fireBeat();
    });

    // ── Transport: STOP ───────────────────────────────────────────
    stopBtn.addEventListener('click', () => {
      if (recorder.isRecording()) {
        recorder.stop();
        const secs = (durationMs(song) / 1000).toFixed(1);
        timeDisplay.textContent = `Recorded ${secs}s · ${song.notes.length} notes`;
      } else if (countingIn) {
        countingIn = false;
        if (countInTimer) clearTimeout(countInTimer);
        countInTimer = null;
        timeDisplay.textContent = 'Ready';
      } else if (playing) {
        stopPlayback();
      }
      renderer.setPlayhead(-1);
      updateButtons();
    });

    // ── Transport: PLAY ───────────────────────────────────────────
    playBtn.addEventListener('click', async () => {
      if (song.notes.length === 0) return;
      if (recorder.isRecording() || countingIn) return;
      await resumeIfSuspended();

      playStartedAt = performance.now();
      playing = true;
      updateButtons();

      // Schedule each note. setTimeout is good enough for phase 1 —
      // sub-10ms scheduling drift won't be noticed for melodic playback.
      // Real Web-Audio precise scheduling can come with samples.
      for (const note of song.notes) {
        const id = setTimeout(() => {
          if (playing) playPianoNote(note.pitch, note.velocity);
        }, note.startMs);
        playTimeouts.push(id);
      }

      const total = durationMs(song);
      const updatePlayhead = () => {
        if (!playing) return;
        const elapsed = performance.now() - playStartedAt;
        renderer.setPlayhead(elapsed);
        timeDisplay.textContent = `Play ${(elapsed / 1000).toFixed(1)}s / ${(total / 1000).toFixed(1)}s`;
        if (elapsed >= total + 100) {
          stopPlayback();
          return;
        }
        playRafId = requestAnimationFrame(updatePlayhead);
      };
      updatePlayhead();
    });

    function stopPlayback() {
      playing = false;
      if (playRafId) cancelAnimationFrame(playRafId);
      playRafId = null;
      for (const id of playTimeouts) clearTimeout(id);
      playTimeouts = [];
      renderer.setPlayhead(-1);
      const secs = (durationMs(song) / 1000).toFixed(1);
      timeDisplay.textContent = `Recorded ${secs}s · ${song.notes.length} notes`;
      updateButtons();
    }

    // ── Quantize buttons ──────────────────────────────────────────
    const qButtons = document.querySelectorAll('.q-btn');
    qButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        const grid = btn.dataset.grid;
        quantize(song, grid);
        activeGrid = grid;
        updateButtons();
      });
    });

    // ── Button state machine ──────────────────────────────────────
    function updateButtons() {
      const rec = recorder.isRecording();
      recordBtn.classList.toggle('active', rec || countingIn);
      playBtn.classList.toggle('active', playing);
      recordBtn.disabled = rec || countingIn || playing;
      stopBtn.disabled   = !rec && !countingIn && !playing;
      playBtn.disabled   = rec || countingIn || song.notes.length === 0;

      // Quantize buttons: highlight active grid, disable while busy or empty.
      const lockQuantize = rec || countingIn || playing || song.notes.length === 0;
      qButtons.forEach(b => {
        b.classList.toggle('active', b.dataset.grid === activeGrid);
        b.disabled = lockQuantize;
      });
    }

    // Periodic refresh for live timer + enabling PLAY after a take.
    setInterval(() => {
      if (recorder.isRecording()) {
        timeDisplay.textContent = `Rec ${(recorder.elapsedMs() / 1000).toFixed(1)}s · ${song.notes.length} notes`;
      }
      updateButtons();
    }, 100);

    updateButtons();
  </script>
</body>
</html>
